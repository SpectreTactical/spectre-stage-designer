<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectre Stage Designer – Version 1.0</title>
<style>
:root{
  --bg:#eef0f4; --card:#fff; --text:#16181d; --muted:#5c6370; --border:#d6d9e0;
  --navy:#14284b; --gold:#c9971f; --accent:#1f4f9f; --ok:#1e8e3e; --warn:#b26a00; --warn-bg:#fff4dc; --bad:#c5221f; --bad-bg:#fde8e7; --info:#2b5797; --info-bg:#e8f0fb;
  --cond:"Barlow Condensed",Bahnschrift,"Arial Narrow","Roboto Condensed",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--border);background:#fff;color:var(--text);padding:5px 10px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
button.danger{color:var(--bad)}
button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:6px;padding:5px 7px;width:100%}
textarea{resize:vertical;min-height:54px}
input[type=checkbox]{width:auto}
label{font-size:.8rem;color:var(--muted);display:block;margin:6px 0 2px}
label.inl{display:inline-flex;align-items:center;gap:5px;color:var(--text);font-size:.88rem;margin:2px 10px 2px 0}
h3{margin:0 0 6px;font-size:.95rem;font-family:var(--cond);text-transform:uppercase;letter-spacing:.03em;color:var(--navy)}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.top{display:flex;align-items:center;gap:14px;background:var(--navy);color:#fff;padding:7px 12px;flex-wrap:wrap}
.brand{font-family:var(--cond);font-size:1.25rem;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.brand b{color:var(--gold)}
.brand .ver{font-size:.75rem;opacity:.7;font-weight:400}
#tabs{display:flex;gap:4px}
#tabs button{background:transparent;color:#cfd6e4;border-color:transparent}
#tabs button[aria-selected=true]{background:#fff;color:var(--navy);font-weight:700}
.top .actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.top .actions button{background:#21375f;color:#fff;border-color:#33507f}
.top .actions button.primary{background:var(--gold);border-color:var(--gold);color:#14284b}
.layout{display:grid;grid-template-columns:230px 1fr 330px;gap:10px;padding:10px;height:calc(100vh - 48px)}
.layout>aside,.layout>main{min-height:0;overflow:auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px}
#stageList{list-style:none;margin:0 0 8px;padding:0}
#stageList li{display:flex;gap:6px;align-items:center;padding:6px 7px;border-radius:7px;cursor:pointer;border:1px solid transparent}
#stageList li:hover{border-color:var(--border)}
#stageList li.cur{background:#e7edf8;border-color:#b9c8e6}
#stageList .num{background:var(--gold);color:var(--navy);font-weight:800;border-radius:5px;min-width:22px;text-align:center;font-family:var(--cond)}
#stageList .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:.7rem;font-weight:700;border-radius:99px;padding:1px 7px}
.badge.e{background:var(--bad-bg);color:var(--bad)}
.badge.w{background:var(--warn-bg);color:var(--warn)}
.badge.ok{background:#e6f4ea;color:var(--ok)}
.btnrow{display:flex;gap:5px;flex-wrap:wrap}
.view{display:none}
.view.show{display:block}
#view-diagram.show{display:flex;flex-direction:column;height:100%}
.toolbar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--border);border-radius:10px;padding:6px;margin-bottom:8px}
.toolbar .sep{width:1px;height:22px;background:var(--border);margin:0 4px}
.edwrap{display:flex;gap:8px;flex:1;min-height:420px}
.palette{width:132px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:6px;overflow:auto;flex:none}
.palette h4{margin:6px 2px 3px;font-size:.7rem;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.palette button{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:3px 5px;margin-bottom:2px;font-size:.8rem;border-color:transparent}
.palette button:hover{border-color:var(--border);background:#f5f7fb}
.palette button.on{background:#e7edf8;color:var(--navy);border-color:#b9c8e6}
.palette svg{width:22px;height:22px;flex:none}
.canvas{position:relative;flex:1;background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;min-width:300px}
#svg{width:100%;height:100%;display:block;touch-action:none;user-select:none}
.canvas.panning #svg{cursor:grab}
.canvas.placing #svg{cursor:crosshair}
.dr{position:absolute;left:8px;top:50%;transform:translateY(-50%) rotate(-90deg);transform-origin:left center;font:700 11px var(--cond);letter-spacing:.12em;color:#4a5160;pointer-events:none;margin-left:10px;margin-top:40px}
.dr:after{content:"";display:inline-block;width:40px;height:2px;background:#4a5160;vertical-align:middle;margin-left:6px;position:relative}
.dr-arrow{position:absolute;left:12px;top:calc(50% - 70px);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid #4a5160;pointer-events:none}
.scalebar{position:absolute;left:14px;bottom:10px;font-size:11px;color:#333;pointer-events:none}
.scalebar .bar{height:6px;border:1px solid #222;background:repeating-linear-gradient(90deg,#222 0 50%,#fff 50% 100%);background-size:50% 100%}
.status{position:absolute;right:8px;bottom:6px;font-size:11px;color:#555;background:rgba(255,255,255,.85);padding:2px 6px;border-radius:5px;pointer-events:none}
.hint{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:12px;background:#14284be6;color:#fff;padding:3px 10px;border-radius:99px;pointer-events:none;white-space:nowrap}
.hint:empty{display:none}
.chk{border-left:4px solid;padding:5px 7px;margin-bottom:5px;border-radius:5px;font-size:.82rem;cursor:default}
.chk.error{border-color:var(--bad);background:var(--bad-bg)}
.chk.warn{border-color:var(--warn);background:var(--warn-bg)}
.chk.info{border-color:var(--info);background:var(--info-bg)}
.chk.link{cursor:pointer}
.chk .ref{display:block;color:var(--muted);font-size:.74rem;margin-top:2px}
.chk .lv{font-weight:700;text-transform:uppercase;font-size:.68rem;margin-right:4px}
.chk.error .lv{color:var(--bad)} .chk.warn .lv{color:var(--warn)} .chk.info .lv{color:var(--info)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 10px}
.brief{max-width:1000px}
.brief .card h3{margin-bottom:4px}
table.eng{width:100%;border-collapse:collapse;font-size:.85rem}
table.eng th{font-size:.7rem;text-transform:uppercase;color:var(--muted);text-align:left;padding:3px}
table.eng td{padding:2px 3px;border-top:1px solid #eef0f4;vertical-align:middle}
table.eng td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.eng input,table.eng select{padding:3px 4px}
table.eng .num{width:58px}
.cls-group{margin:4px 0}
.cls-group b{font-size:.78rem;color:var(--navy);display:block}
.totals{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{display:inline-block;border:1.5px solid var(--navy);border-radius:7px;padding:2px 9px;font:700 .78rem var(--cond);text-transform:uppercase;letter-spacing:.03em;color:var(--navy)}
.chip.f{background:var(--navy);color:#fff}
.chip.g{background:var(--gold);border-color:var(--gold);color:var(--navy)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:#1b2333;color:#fff;padding:9px 16px;border-radius:9px;opacity:0;transition:.25s;pointer-events:none;z-index:50;font-size:.9rem}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.printbar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
#pages{padding-bottom:20px}
.help p,.help li{max-width:780px}
kbd{border:1px solid #bbb;border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:.8rem;background:#fafafa}
.mdset{border:2px dashed var(--gold);background:#fffaf0}
.tag-md{display:inline-block;background:var(--gold);color:var(--navy);font-weight:800;font-size:.68rem;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}

/* ---------- printed pages ---------- */
.page{width:210mm;height:297mm;background:#fff;color:#1b2333;position:relative;overflow:hidden;margin:0 auto 8mm;box-shadow:0 2px 12px rgba(0,0,0,.18);padding:9mm 10mm 15mm;font:7.9pt/1.33 Barlow,"Segoe UI",Arial,sans-serif}
.page .cond{font-family:var(--cond)}
.page h4{font:800 10.5pt var(--cond);text-transform:uppercase;color:var(--navy);margin:3.2mm 0 1.2mm;letter-spacing:.01em}
.page h5{font:800 8.6pt var(--cond);color:var(--navy);margin:1.6mm 0 .6mm}
.page p{margin:0 0 1.2mm}
.page ul,.page ol{margin:0 0 1.2mm;padding-left:4.2mm}
.page li{margin-bottom:.5mm}
.page table{width:100%;border-collapse:collapse;font-size:7.4pt}
.page th{background:var(--navy);color:#fff;text-align:left;padding:1mm 1.4mm;font-weight:700}
.page td{padding:.8mm 1.4mm;border-bottom:.2mm solid #d5dae4;vertical-align:top}
.page tr:nth-child(even) td{background:#f3f5f9}
.page td.r{white-space:nowrap}
.page tfoot td,.page tr.tot td{font-weight:700;background:#e9edf4!important}
.pfoot{position:absolute;left:10mm;right:10mm;bottom:6mm;border-top:.5mm solid var(--gold);padding-top:1.2mm;font-size:6.6pt;color:#555;display:flex;justify-content:space-between;gap:4mm}
.pfoot i{display:block}
.cover{background:var(--navy);color:#fff;padding:9mm 9mm 8mm;border-bottom:2.2mm solid var(--gold);margin:-9mm -10mm 0}
.cover .club{color:var(--gold);font:800 9.5pt var(--cond);letter-spacing:.04em}
.cover .t1{font:800 27pt/1.05 var(--cond);margin:2mm 0 1mm}
.cover .t2{font:800 15pt var(--cond);color:#dfe5f0;margin-bottom:5mm}
.cover .meta{font-size:8.6pt;color:#e7ebf3}
.cover .meta2{font-size:7.6pt;color:#aeb8cc;margin-top:2mm}
.sbar{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;padding:2.5mm 4mm;margin:-9mm -10mm 3mm}
.sbar b{font:800 13pt var(--cond)}
.sbar span{font:700 8pt var(--cond);color:var(--gold);letter-spacing:.04em}
.shead{display:flex;margin:-9mm -10mm 0;height:25mm}
.shead .badge2{width:30mm;background:var(--gold);color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--cond)}
.shead .badge2 small{font-weight:800;font-size:7.5pt;letter-spacing:.06em}
.shead .badge2 b{font-size:28pt;line-height:1}
.shead .band{flex:1;background:var(--navy);color:#fff;padding:4mm 6mm;position:relative}
.shead .band .tt{font:800 19pt/1.05 var(--cond);text-transform:uppercase;margin-top:2.5mm}
.shead .band .st{font-size:7.6pt;color:#dfe5f0;margin-top:1.5mm}
.shead .band .sp{position:absolute;right:5mm;top:3.5mm;color:var(--gold);font:800 7.2pt var(--cond)}
.chips{display:flex;gap:1.6mm;flex-wrap:wrap;margin:3mm 0 1.5mm}
.chips .chip{font-size:7.4pt;border-radius:2.2mm;padding:.8mm 3mm;border-width:.4mm}
.elig{font-size:7.8pt;margin-bottom:1.6mm}
.elig b{font-weight:800}
.elig span{color:#555;margin-left:3mm;font-size:7.2pt}
.dbox{border:.3mm solid #9aa3b5;position:relative;height:80mm}
.dbox .dtag{position:absolute;left:0;top:0;background:var(--navy);color:#fff;font:800 6.8pt var(--cond);padding:.8mm 2.5mm;z-index:2}
.dbox svg{width:100%;height:100%;display:block}
.dnote{position:absolute;right:2mm;bottom:1.2mm;font-size:6.6pt;color:#b0651a;font-style:italic;max-width:110mm;text-align:right}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:5mm;margin-top:1mm}
.cols>div:first-child{border-right:.2mm solid #d5dae4;padding-right:4mm}
.mdbox{background:#fdf6dc;border-left:1.4mm solid var(--gold);padding:2mm 4mm;margin-top:3mm;font-size:7.3pt}
.mdbox h5{margin-top:0;font-size:8.4pt}
.mdbox ul{margin:0}
.dqnote{border:.3mm solid var(--bad);color:#8b1712;background:#fdeceb;padding:1mm 2mm;margin:1mm 0;font-size:7.2pt}
.keygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:2mm 4mm;font-size:7.2pt;align-items:center}
.keygrid div{display:flex;align-items:center;gap:2mm}
.keygrid svg{width:8mm;height:8mm;flex:none}
.rosheet td{height:7.4mm}
.mdset-p{border:.4mm dashed var(--gold);background:#fffaf0;padding:1.5mm 3mm;font-size:7.2pt}

.page .trl{font-size:7.1pt}
@page{size:A4 portrait;margin:0}
@media print{
  html,body{height:auto;background:#fff}
  .top,.layout>aside,.printbar,.view:not(#view-print),#toast{display:none!important}
  .layout{display:block;padding:0;height:auto}
  .layout>main{overflow:visible}
  #view-print{display:block!important}
  #pages{padding:0}
  .page{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.drw{position:absolute;left:10px;top:38%;display:flex;flex-direction:column;align-items:center;pointer-events:none;gap:4px}
.drw .ar{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:12px solid #4a5160}
.drw .ln{width:2px;height:34px;background:#4a5160;margin-top:-4px}
.drw .tx{writing-mode:vertical-rl;transform:rotate(180deg);font:700 11px var(--cond);letter-spacing:.14em;color:#4a5160}

.fitwarn{margin-top:6px;padding:6px 8px;background:#fdecea;border:1px solid #e2a3a0;color:#8b1712;border-radius:6px;font-size:12px}
.page th .rq{font-weight:400;font-size:6.4pt;opacity:.85}
#reqTable select{max-width:230px}

.sugg{font-weight:600;color:#9a6d00;background:#fff4d6;border-radius:3px;padding:0 4px;font-size:11px}

/* ---- v4: collapsible panels, maximised map, edge scroll arrows ---- */
.layout{grid-template-columns:var(--lw,230px) 1fr var(--rw,330px)}
body.lcol{--lw:30px} body.rcol{--rw:30px}
.layout>aside{position:relative}
.colbtn{position:sticky;top:0;z-index:3;display:block;width:26px;height:26px;padding:0;line-height:22px;font-size:15px;font-weight:700;color:var(--navy);margin:0 0 6px auto;border-radius:6px;background:#fff}
aside.right .colbtn{margin:0 auto 6px 0}
body.lcol aside.left>*:not(.colbtn), body.rcol aside.right>*:not(.colbtn){display:none!important}
body.lcol aside.left, body.rcol aside.right{background:#dfe3ea;border-radius:8px;cursor:pointer;overflow:hidden}
body.lcol aside.left .colbtn, body.rcol aside.right .colbtn{margin:2px auto}
body.lcol aside.left:after, body.rcol aside.right:after{content:attr(data-strip);display:block;writing-mode:vertical-rl;font:700 11px var(--cond);letter-spacing:.14em;color:#4a5160;margin:8px auto;text-transform:uppercase}
.palwrap{display:flex;flex-direction:column;flex:none;min-height:0}
.palwrap .colbtn{margin:0 0 4px auto}
.palwrap .palette{flex:1}
body.pcol .palwrap{width:30px;background:#dfe3ea;border-radius:8px;cursor:pointer}
body.pcol .palwrap .palette{display:none}
body.pcol .palwrap .colbtn{margin:2px auto}
body.pcol .palwrap:after{content:"PALETTE";writing-mode:vertical-rl;font:700 11px var(--cond);letter-spacing:.14em;color:#4a5160;margin:8px auto}
.edge{position:absolute;z-index:4;padding:0;width:26px;height:44px;font-size:22px;line-height:1;color:var(--navy);background:rgba(255,255,255,.82);border:1px solid var(--border);border-radius:7px;opacity:.75;user-select:none;touch-action:none}
.edge:hover{opacity:1;background:#fff}
.edge.held{background:var(--navy);color:#fff;opacity:1}
.edge-l{left:3px;top:50%;transform:translateY(-50%)} .edge-r{right:3px;top:50%;transform:translateY(-50%)}
.edge-t{top:3px;left:50%;transform:translateX(-50%);width:44px;height:26px} .edge-b{bottom:3px;left:50%;transform:translateX(-50%);width:44px;height:26px}
.drw{left:36px}
.hint{top:34px}
.maxbar{display:none}
body.maxmap .top, body.maxmap aside.left, body.maxmap .toolbar, body.maxmap .palwrap .colbtn{display:none!important}
body.maxmap .layout{grid-template-columns:1fr;padding:0;gap:0;height:100vh}
body.maxmap .layout>main{overflow:hidden}
body.maxmap .edwrap{gap:0}
body.maxmap .canvas{border-radius:0;border:0}
body.maxmap .palwrap{display:none}
body.maxmap .maxbar{display:flex;position:absolute;left:10px;top:8px;z-index:25;gap:3px;align-items:center;background:rgba(255,255,255,.96);border:1px solid var(--border);border-radius:10px;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,.16)}
body.maxmap .maxbar button{padding:3px 8px;font-size:.82rem}
body.maxmap .maxbar .sep{width:1px;height:20px;background:var(--border);margin:0 3px}
body.maxmap .edge-t{left:auto;right:50%;transform:translateX(50%)}
body.maxmap aside.right{display:none}
body.maxmap.hassel aside.right{display:block!important;position:fixed;right:12px;top:10px;width:320px;max-height:calc(100vh - 24px);overflow:auto;z-index:30;background:transparent}
body.maxmap.hassel aside.right>*{display:none!important}
body.maxmap.hassel aside.right #propsCard{display:block!important;box-shadow:0 6px 24px rgba(0,0,0,.22);margin:0}
body.maxmap.hassel aside.right:after{display:none}
body.maxmap .edge-r{right:3px}
body.maxmap.hassel .edge-r{right:340px}
@media print{ .edge,.maxbar,.colbtn{display:none!important} }

/* ---- v5: on-map zoom control ---- */
.zoomctl{position:absolute;right:38px;bottom:28px;z-index:5;display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.94);border:1px solid var(--border);border-radius:8px;padding:2px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.zoomctl button{padding:2px 8px;font-size:.85rem;min-width:28px;line-height:1.3}
.zoomctl .zclevel{font:600 11px system-ui,sans-serif;color:#333;min-width:86px;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.canvas:focus{outline:none}
body.maxmap.hassel aside.right{max-height:calc(100vh - 90px)}
@media print{ .zoomctl{display:none!important} }
.keys{border-collapse:collapse;font-size:.85rem;margin:4px 0 10px}.keys td{border-bottom:1px solid var(--border);padding:3px 10px 3px 0;vertical-align:top}.keys td:first-child{white-space:nowrap}
.chk .fixbtn{margin:3px 0 0;padding:1px 8px;font-size:.76rem;font-weight:600;background:#fff;border-color:var(--warn);color:var(--warn)}
.chk .fixbtn:hover{background:var(--warn);color:#fff}

/* ---- v7 print layout: big diagram, compact scoring strip ---- */
.spage .dbox{height:150mm}
.dbox .dsvg{position:absolute;inset:0}
.dbox .dsvg svg{width:100%;height:100%;display:block}
.sstrip{margin:1.8mm 0 .6mm;padding:1.3mm 2.2mm;background:#eef2f8;border-left:1.4mm solid var(--navy);font-size:7.6pt;line-height:1.45}
.sstrip .stag{font:800 7.6pt var(--cond);color:var(--navy);letter-spacing:.05em;margin-right:1.6mm}
.sstrip .dot{color:#8a93a6}
.sstrip .sref{font-weight:700;color:var(--navy);white-space:nowrap}
.spage .cols{margin-top:.6mm}
.spage h4{margin:2.2mm 0 1mm}
.spage .trl{font-size:7.6pt}
.skey{grid-template-columns:repeat(3,1fr)}

.page.fit1{font-size:7.6pt} .page.fit1 .dbox{height:150mm} .page.fit1 table{font-size:7.2pt} .page.fit1 .mdbox{font-size:7.1pt} .page.fit1 .trl{font-size:7.3pt} .page.fit1 .sstrip{font-size:7.4pt} .page.fit1 .elig{font-size:7.4pt}
.page.fit2{font-size:7.3pt} .page.fit2 .dbox{height:142mm} .page.fit2 table{font-size:7.0pt} .page.fit2 .mdbox{font-size:6.9pt} .page.fit2 .trl{font-size:7.0pt} .page.fit2 .sstrip{font-size:7.2pt} .page.fit2 .elig{font-size:7.2pt}
.page.fit3{font-size:7.1pt} .page.fit3 .dbox{height:136mm} .page.fit3 table{font-size:6.9pt} .page.fit3 .mdbox{font-size:6.8pt} .page.fit3 .trl{font-size:6.9pt} .page.fit3 .sstrip{font-size:7.0pt} .page.fit3 .elig{font-size:7.0pt} .page.fit3 td{padding:.5mm 1.2mm}

<body>
<header class="top">
  <div class="brand"><b>SPECTRE</b> Stage Designer <span class="ver">Version 1.0</span></div>
  <nav id="tabs">
    <button data-tab="diagram" id="tabbtn-diagram">Diagram</button>
    <button data-tab="brief" id="tabbtn-brief">Stage brief</button>
    <button data-tab="print" id="tabbtn-print">Print preview</button>
    <button data-tab="settings" id="tabbtn-settings">MD settings</button>
    <button data-tab="help" id="tabbtn-help">Help</button>
  </nav>
  <div class="actions">
    <button id="btnPrint" class="primary" title="Print or save the stage pack as PDF (A4)">Print / Save PDF</button>
    <button id="btnExport" title="Download the whole match as a JSON backup">Export match</button>
    <button id="btnImport" title="Replace the current match with a JSON backup">Import…</button>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
    <button id="btnAddFrom" title="Add stages from another match file or a single-stage file – your current match is kept, the file is only read">Add stages from file…</button>
    <input type="file" id="fileAddFrom" accept=".json,application/json" hidden>
    <button id="btnExample">Load example</button>
    <button id="btnNew">New match</button>
  </div>
</header>
<div class="layout">
  <aside class="left" id="asideLeft" data-strip="Match · Stages">
    <button class="colbtn" id="colLeft" data-col="left" title="Collapse this panel" aria-expanded="true">«</button>
    <section class="card" id="matchCard">
      <h3>Match</h3>
      <label for="mName">Name</label><input id="mName" data-m="name">
      <label for="mDate">Date</label><input id="mDate" type="date" data-m="date">
      <label for="mVenue">Venue</label><input id="mVenue" data-m="venue">
      <label for="mDesigner">Stage designer</label><input id="mDesigner" data-m="designer">
    </section>
    <section class="card">
      <h3>Stages</h3>
      <ol id="stageList"></ol>
      <div class="btnrow">
        <button id="stAdd">+ Add</button><button id="stDup">Duplicate</button><button id="stExport" title="Download this stage alone as a JSON file for your stage library">Export stage</button>
        <button id="stUp" title="Move stage up">↑</button><button id="stDown" title="Move stage down">↓</button>
        <button id="stDel" class="danger">Delete</button>
      </div>
    </section>
    <section class="card small muted" id="storeNote"></section>
  </aside>
  <main>
    <section id="view-diagram" class="view">
      <div class="toolbar" id="toolbar">
        <button data-tool="select" id="tool-select" title="Select / move (V)">Select</button>
        <button data-tool="pan" id="tool-pan" title="Pan (hold Space, or drag with the middle or right button)">Pan</button>
        <button data-tool="link" id="tool-link" title="Sight line: click a position, then each target it engages (L)">Sight line</button>
        <button data-tool="move" id="tool-move" title="Movement: click positions in the order they are visited (M)">Movement</button>
        <button data-tool="measure" id="tool-measure" title="Measure: click two points (K)">Measure</button>
        <span class="sep"></span>
        <button id="zoomOut" title="Zoom out (−)">−</button><button id="zoomIn" title="Zoom in (+)">+</button><button id="zoomFit" title="Fit the whole stage (0)">Fit</button>
        <label class="inl" title="Snap to 0.5 m"><input type="checkbox" id="snap" checked> Snap 0.5 m</label>
        <span class="sep"></span>
        <button id="btnUndo" title="Undo (Ctrl+Z)">↶ Undo</button><button id="btnRedo" title="Redo (Ctrl+Y)">↷ Redo</button>
        <button id="btnRotL" title="Rotate −15° (Shift+R)">⟲</button><button id="btnRotR" title="Rotate +15° (R)">⟳</button>
        <button id="btnDelete" class="danger" title="Delete (Del)">Delete</button>
        <span class="sep"></span>
        <button id="btnPathUndo" title="Remove the last movement step">Path −1</button><button id="btnPathClear" title="Clear the movement path">Clear path</button>
        <span class="sep"></span>
        <button id="btnPNG">PNG</button><button id="btnSVG">SVG</button>
        <span class="sep"></span>
        <button id="btnMax" title="Maximise map: hide the panels and header (F; Esc to exit)">⛶ Maximise map</button>
      </div>
      <div class="edwrap">
        <div class="palwrap" id="palWrap"><button class="colbtn" id="colPal" data-col="pal" title="Collapse the palette" aria-expanded="true">«</button><div class="palette" id="palette"></div></div>
        <div class="canvas" id="canvasWrap" tabindex="-1">
          <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
          <div class="drw"><div class="ar"></div><div class="ln"></div><div class="tx">DOWNRANGE</div></div>
          <div class="scalebar" id="scalebar"></div>
          <div class="status" id="status"></div>
          <div class="hint" id="hint"></div>
          <button class="edge edge-l" data-pan="l" title="Scroll left (hold to keep scrolling)" aria-label="Scroll left">‹</button>
          <button class="edge edge-r" data-pan="r" title="Scroll right (hold to keep scrolling)" aria-label="Scroll right">›</button>
          <button class="edge edge-t" data-pan="t" title="Scroll downrange (hold to keep scrolling)" aria-label="Scroll up">˄</button>
          <button class="edge edge-b" data-pan="b" title="Scroll uprange (hold to keep scrolling)" aria-label="Scroll down">˅</button>
          <div class="fpal" id="fpal" hidden role="toolbar" aria-label="Item palette">
            <div class="fpalbar" id="fpalBar" title="Drag to move the palette"><span class="grip">⋮⋮</span><b>Items</b><button id="fpalMin" class="small" title="Collapse the palette to a small button" aria-expanded="true">–</button></div>
            <div class="fpalbody" id="fpalBody"></div>
          </div>
          <div class="zoomctl" id="zoomCtl" role="group" aria-label="Zoom">
            <button id="zcOut" title="Zoom out (−)" aria-label="Zoom out">−</button><span id="zcLevel" class="zclevel" title="Current scale (Ctrl+wheel zooms finely)">–</span><button id="zcIn" title="Zoom in (+)" aria-label="Zoom in">+</button><button id="zcFit" title="Fit the whole stage (0)">Fit</button>
          </div>
          <div class="maxbar" id="maxbar">
            <span class="mxgrip" id="mxGrip" title="Drag to move the toolbar – double-click to put it back">⋮⋮</span>
            <button data-tool="select" title="Select / move (V)">Select</button><button data-tool="pan" title="Pan">Pan</button><button data-tool="link" title="Sight line (L)">Sight</button><button data-tool="move" title="Movement (M)">Move</button><button data-tool="measure" title="Measure (K)">Measure</button>
            <span class="sep"></span><button id="mxPal" title="Show / hide the item palette" aria-expanded="false">＋ Items ▾</button>
            <span class="sep"></span><button id="mxOut" title="Zoom out (−)">−</button><button id="mxIn" title="Zoom in (+)">+</button><button id="mxFit" title="Fit the whole stage (0)">Fit</button>
            <button id="mxUndo" title="Undo (Ctrl+Z)">↶</button><button id="mxDel" class="danger" title="Delete (Del)">Delete</button>
            <span class="sep"></span><button id="mxExit" class="primary" title="Exit maximised map (Esc or F)">✕ Exit (Esc)</button>
          </div>
        </div>
      </div>
    </section>
    <section id="view-brief" class="view"><div id="briefForm" class="brief"></div></section>
    <section id="view-print" class="view">
      <div class="printbar card">
        <button class="primary" id="btnPrint2">Print / Save as PDF</button>
        <label class="inl"><input type="checkbox" id="optRO"> Include an RO score sheet per stage</label>
        <span class="muted small">A4 portrait. In the print dialog choose “Save as PDF”, margins “None” or “Default”, and tick “Background graphics”.</span>
        <div id="fitWarn" class="fitwarn" hidden></div>
      </div>
      <div id="pages"></div>
    </section>
    <section id="view-settings" class="view"><div id="settingsForm" class="brief"></div></section>
    <section id="view-help" class="view"><div class="card help" id="helpBox"></div></section>
  </main>
  <aside class="right" id="asideRight" data-strip="Properties · Rule checks">
    <button class="colbtn" id="colRight" data-col="right" title="Collapse this panel" aria-expanded="true">»</button>
    <section class="card" id="propsCard"><h3>Properties</h3><div id="props"></div></section>
    <section class="card"><h3>Rule checks <span id="chkCount"></span></h3><div id="checks"></div></section>
  </aside>
</div>
<div id="toast" role="status"></div>

<div id="libDlg" class="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="libTitle">
  <div class="dlgbox">
    <h3 id="libTitle">Add stages from file</h3>
    <p id="libInfo" class="small"></p>
    <div class="btnrow"><button id="libAll" class="small">Select all</button><button id="libNone" class="small">Select none</button></div>
    <div id="libList"></div>
    <div class="btnrow dlgfoot"><button id="libCancel">Cancel</button><button id="libAdd" class="primary">Add stages</button></div>
  </div>
</div>

  st.items.forEach(function(t){ if(!isTarget(t) || isNoShoot(t)) return; var r = reqOf(st, t); if(!r.rounds.any) return; if(!g[r.text]){ g[r.text] = []; order.push(r.text); } g[r.text].push(t.label); });
  return order.map(function(k){ return "<b>" + esc(labelRanges(g[k])) + "</b> " + esc(k); }).join("; ");
}
/* printed props line: "2 x stacked barrels (standing cover); V-Tac barricade, 1.2 m (…)" */
function propsText(st){

  ["double","single"].forEach(function(k){ var n = st.items.filter(function(i){ return i.type === "cbarrel" && i.stack === k; }).length; if(!n) return;
    parts.push(n + " x " + (k === "double" ? "stacked barrel" : "barrel") + (n > 1 ? "s" : "") + " (" + BARREL_STACK[k].cover + ")"); });
  st.items.filter(function(i){ return i.type === "vtac"; }).forEach(function(v){
    var L = Math.hypot(v.x2 - v.x, v.y2 - v.y), extra = [];
    if(v.label) extra.push(v.label); extra.push(fmtM(v.h).replace(" m", "") + " m tall"); extra.push(v.ports + " V-port" + (v.ports === 1 ? "" : "s"));
    var refs = st.items.filter(function(p){ return p.vtac === v.id; }).map(function(p){ return p.label + " shoots through it" + (p.vtacPort ? " (" + p.vtacPort + ")" : ""); });
    var tail = (v.portNote ? "; " + v.portNote : "") + (refs.length ? "; " + refs.join(", ") : "");
    parts.push("V-Tac barricade, " + fmtM(L) + " (" + extra.join(", ") + tail + ")");
  });
  [["door","doorway","doorways"],["port","aperture","apertures"]].forEach(function(d){ var n = st.items.filter(function(i){ return i.type === d[0]; }).length; if(n) parts.push(n + " x " + (n > 1 ? d[2] : d[1]) + " (cover)"); });
  ["concrete","tyres","backstop"].forEach(function(t){ st.items.filter(function(i){ return i.type === t; }).forEach(function(v){
    parts.push((t === "concrete" ? "Concrete wall (fixed)" : t === "tyres" ? "Tyre wall (fixed)" : "Backstop / berm (270° range)") + ", " + fmtM(Math.hypot(v.x2 - v.x, v.y2 - v.y)) + (v.label ? " (" + v.label + ")" : "")); }); });
  return parts.join("; ");
}

function scoreRows(models){
  var S = state.settings, has = function(m){ return models.indexOf(m) >= 0; };
  var cols = models.filter(function(m){ return m === "negative" || m === "positive"; });
  function v(neg, pos){ return cols.map(function(m){ return "<td><b>" + (m === "negative" ? neg : pos) + "</b></td>"; }).join(""); }
  return { cols: cols, v: v, has: has, S: S };
}

  var c = {}, m = { wall: 0, fault: 0 }, inc = function(k, n){ c[k] = (c[k] || 0) + (n == null ? 1 : n); };
  st.items.forEach(function(i){
    var t = i.type;
    if(TYPES[t].infra || t === "text") return;
    if(t === "noshoot"){ inc("ns_free"); inc("stand_paper"); return; }
    if(isPaper(i)){ inc(t); inc("stand_paper"); if(stapled(i)) inc("ns_staple"); return; }
    if(t === "steel_hang" || (t === "steel_torso" && i.mount !== "static")){ inc(t); inc("stand_hang"); return; }
    if(isSteel(i)){ inc(t); if(t !== "popper") inc("stand_steel"); return; }
    if(t === "barrel"){ inc(i.color === "blue" ? "barrel_blue" : "barrel_red"); return; }
    if(t === "cbarrel"){ inc("cbarrel", i.stack === "double" ? 2 : 1); return; }
    if(t === "wall" || t === "fault"){ inc(t); m[t] += Math.hypot(i.x2 - i.x, i.y2 - i.y); return; }
    inc(t);
  });
  return { c: c, m: m };
}
function propListHTML(){
  var per = state.stages.map(propCounts), tot = {}, mt = { wall: 0, fault: 0 };
  per.forEach(function(p){ Object.keys(p.c).forEach(function(k){ tot[k] = (tot[k] || 0) + p.c[k]; }); mt.wall += p.m.wall; mt.fault += p.m.fault; });
  var h = '<table class="plist"><thead><tr><th>Item</th>' + state.stages.map(function(s, i){ return '<th class="n" title="' + esc(s.title) + '">S' + (i + 1) + '</th>'; }).join("") + '<th class="n">Match total</th></tr></thead><tbody>';
  PL_ROWS.forEach(function(g){
    var rows = g[1].filter(function(r){ return tot[r[0]]; }); if(!rows.length) return;
    h += '<tr class="pgrp"><td colspan="' + (state.stages.length + 2) + '">' + esc(g[0]) + '</td></tr>';
    rows.forEach(function(r){
      var extra = (r[0] === "wall" || r[0] === "fault") ? function(v){ return v; } : null;
      h += '<tr><td>' + esc(r[1]) + '</td>' + per.map(function(p){ var v = p.c[r[0]] || 0, mm = extra && v ? '<br><span class="small muted">' + fmtM(p.m[r[0]]) + '</span>' : ""; return '<td class="n">' + (v || "–") + mm + '</td>'; }).join("") + '<td class="n"><b>' + tot[r[0]] + '</b>' + (extra ? '<br><span class="small muted">' + fmtM(mt[r[0]]) + '</span>' : "") + '</td></tr>';
    });
  });
  h += '</tbody></table>';
  var fixed = []; state.stages.forEach(function(s, i){ var f = s.items.filter(function(x){ return TYPES[x.type].infra; }).length; if(f) fixed.push("S" + (i + 1) + ": " + f); });
  var bays = state.stages.map(function(s, i){ return s.bay ? "S" + (i + 1) + " – " + s.bay.name : null; }).filter(Boolean);
  var notes = [];
  if(fixed.length) notes.push("Fixed range infrastructure (concrete, tyre walls, backstops) is not counted – it is already on the range (" + fixed.join(", ") + ").");
  if(bays.length) notes.push("Bays: " + bays.join("; ") + ".");
  notes.push("Stands are estimated from the diagram: one per paper target or stand-alone no-shoot, one frame per hanging plate or hanging torso. Poppers stand on their own base. Bring spares, pasters and staples.");
  return h + notes.map(function(n){ return '<p class="small muted">' + esc(n) + '</p>'; }).join("");
}
function propListCSV(){
  var per = state.stages.map(propCounts), rows = [["Group", "Item"].concat(state.stages.map(function(s, i){ return "Stage " + (i + 1); })).concat(["Match total"])];
  PL_ROWS.forEach(function(g){ g[1].forEach(function(r){ var vs = per.map(function(p){ return p.c[r[0]] || 0; }), t = vs.reduce(function(a, b){ return a + b; }, 0); if(t) rows.push([g[0], r[1]].concat(vs).concat([t])); }); });
  return rows.map(function(r){ return r.map(function(v){ v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(","); }).join("\r\n");
}
var PL_CSS = 'body{font-family:Barlow,Segoe UI,Arial,sans-serif;color:#14284b;margin:14mm}h1{font-size:20px;margin:0}h2{font-size:13px;font-weight:600;margin:2px 0 10px;color:#555}table.plist{border-collapse:collapse;width:100%;font-size:12px}.plist th,.plist td{border:1px solid #c9ced8;padding:3px 6px;text-align:left;vertical-align:top}.plist th{background:#14284b;color:#fff}.plist .n{text-align:center}.plist .pgrp td{background:#f3ead4;font-weight:700}.small{font-size:11px}.muted{color:#666}ol.st{font-size:12px;columns:2}@page{size:A4;margin:0}';
function propListDoc(){
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Prop and target list – ' + esc(state.match.name) + '</title><style>' + PL_CSS + '</style></head><body><h1>Prop and target list – setup crew</h1><h2>' + esc(state.match.name + " · " + (state.match.date || "") + " · " + (state.match.venue || "")) + '</h2>' +
    '<ol class="st">' + state.stages.map(function(s){ return '<li>' + esc(s.title) + (s.bay ? ' <span class="muted">(' + esc(s.bay.name) + ')</span>' : "") + '</li>'; }).join("") + '</ol>' + propListHTML() + '</body></html>';
}
function openPropList(){
  dlgOpen("plDlg", "Prop and target list – " + state.match.name, '<p class="small muted">Counted from the diagrams of all ' + state.stages.length + ' stage(s). Per stage (S1, S2…) and match totals.</p><div id="plBody" style="overflow:auto;margin:6px 0">' + propListHTML() + '</div><div class="btnrow dlgfoot"><button id="plCSV">Download CSV</button><button id="plPrint" class="primary">Print / Save PDF</button><button id="plClose">Close</button></div>');
  $("plClose").onclick = function(){ dlgClose("plDlg"); };
  $("plCSV").onclick = function(){ download("spectre-props-" + slug(state.match.name) + "-" + (state.match.date || todayISO()) + ".csv", propListCSV(), "text/csv"); toast("Prop list CSV downloaded"); };
  $("plPrint").onclick = printPropList;
}
function printPropList(){
  var f = document.createElement("iframe"); f.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0"; document.body.appendChild(f);
  f.contentDocument.open(); f.contentDocument.write(propListDoc()); f.contentDocument.close();
  setTimeout(function(){ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){} setTimeout(function(){ f.remove(); }, 2000); }, 200);
}

/* ================= 3. Bay templates ================= */
function baysLoad(){ var l = lsGet(BAY_KEY, []); return Array.isArray(l) ? l : []; }
function baysSave(l){ return lsSet(BAY_KEY, l); }
function bayFromStage(st, name, w, d){
  var b = st.bay || { x0: -w / 2, y0: -2 };
  var feats = st.items.filter(function(i){ return TYPES[i.type].infra; }).map(function(i){ var c = JSON.parse(JSON.stringify(i)); delete c.id; c.x -= b.x0; c.y -= b.y0; if(isLine(c)){ c.x2 -= b.x0; c.y2 -= b.y0; } return c; });
  return { id: uid(), name: name, w: w, d: d, notes: "", downrange: +st.downrange || 0, features: feats };
}
function applyBay(st, t, opts){
  opts = opts || {};
  commit(function(){
    var old = st.bay, nb = cleanBay({ name: t.name, w: t.w, d: t.d, x0: old ? old.x0 : -t.w / 2, y0: old ? old.y0 : -2 });
    st.bay = nb;
    if(opts.features !== false && t.features && t.features.length){
      st.items = st.items.filter(function(i){ return !(TYPES[i.type].infra && i.bayFeat); });
      t.features.forEach(function(f){ var it = JSON.parse(JSON.stringify(f)); it.id = uid(); it.bayFeat = 1; it.x += nb.x0; it.y += nb.y0; if(isLine(it)){ it.x2 += nb.x0; it.y2 += nb.y0; } st.items.push(it); });
    }
    if(opts.fit){
      var tg = st.items.filter(function(i){ return !TYPES[i.type].infra; });
      if(tg.length){
        var xs = [], ys = []; tg.forEach(function(i){ xs.push(i.x); ys.push(i.y); if(isLine(i)){ xs.push(i.x2); ys.push(i.y2); } });
        var bx = (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2, by0 = Math.min.apply(null, ys);
        var dx = (nb.x0 + nb.w / 2) - bx, dy = Math.max(nb.y0 + 1 - by0, Math.min(0, nb.y0 + nb.d - 0.5 - Math.max.apply(null, ys)));
        if(by0 >= nb.y0 + 0.5 && Math.max.apply(null, ys) <= nb.y0 + nb.d) dy = 0;
        tg.forEach(function(i){ i.x += dx; i.y += dy; if(isLine(i)){ i.x2 += dx; i.y2 += dy; } });
      }
    }
  });
  fitBay(st); render();
}
function fitBay(st){ if(typeof fitView === "function") fitView(); }
function clearBay(st, keepFeat){
  commit(function(){ delete st.bay; if(!keepFeat) st.items = st.items.filter(function(i){ return !i.bayFeat; }); });
  render();
}
function openBays(){
  var st = cur();
  dlgOpen("bayDlg", "Bay templates", '<p class="small muted">Save each SWPC bay once (width across, depth downrange, and its fixed concrete / tyre walls and backstops), then pick it for a stage: the bay outline is drawn on the map and in the print, its fixed features are placed for you, and Rule checks warn when an item falls outside the bay. Dimensions are yours to measure – none are assumed.</p>' +
    '<p><b>Stage ' + stageNo(st) + ' – ' + esc(st.title) + ':</b> ' + (st.bay ? esc(st.bay.name + " (" + fmtM(st.bay.w) + " × " + fmtM(st.bay.d) + ")") + ' <button id="bayNone" class="small">Remove bay from stage</button>' : '<span class="muted">no bay chosen</span>') + '</p>' +
    '<div id="bayList" style="overflow:auto;margin:6px 0;border:1px solid #dde2ea;border-radius:6px"></div>' +
    '<fieldset style="border:1px solid #dde2ea;border-radius:6px;margin:6px 0"><legend class="small"><b>New bay template</b></legend><div class="btnrow"><label class="inl">Name <input id="bayName" placeholder="e.g. SWPC Bay 3" style="width:160px"></label><label class="inl">Width (m) <input id="bayW" type="number" min="1" step="0.5" style="width:70px"></label><label class="inl">Depth (m) <input id="bayD" type="number" min="1" step="0.5" style="width:70px"></label><label class="inl" title="Copy the concrete walls, tyre walls and backstops drawn on the current stage into the template"><input type="checkbox" id="bayFeat" checked> take fixed features from this stage</label><button id="bayAdd" class="primary">Save template</button></div></fieldset>' +
    '<div class="btnrow dlgfoot"><button id="bayExport">Export bays</button><button id="bayImport">Import bays…</button><input type="file" id="bayFile" accept=".json,application/json" hidden><button id="bayClose">Close</button></div>');
  bayRender();
  $("bayClose").onclick = function(){ dlgClose("bayDlg"); };
  if($("bayNone")) $("bayNone").onclick = function(){ var keep = !confirm("Remove the bay from this stage.\nOK = also remove the fixed features it placed. Cancel = keep them."); clearBay(cur(), keep); openBays(); };
  $("bayAdd").onclick = function(){
    var n = $("bayName").value.trim(), w = +$("bayW").value, d = +$("bayD").value;
    if(!n || !(w > 0) || !(d > 0)){ alert("Give the bay a name, a width and a depth in metres."); return; }
    var t = bayFromStage(cur(), n, w, d); if(!$("bayFeat").checked) t.features = [];
    var l = baysLoad(); l.push(t); baysSave(l); toast("Bay template saved: " + n + (t.features.length ? " (" + t.features.length + " fixed features)" : "")); openBays();
  };
  $("bayExport").onclick = function(){ download("spectre-bays-" + todayISO() + ".json", JSON.stringify({ app: APP_ID, kind: "bays", version: SCHEMA, bays: baysLoad() }, null, 1), "application/json"); };
  $("bayImport").onclick = function(){ $("bayFile").click(); };
  $("bayFile").onchange = function(){ var f = this.files && this.files[0], inp = this; if(!f) return; var rd = new FileReader(); rd.onload = function(){ inp.value = ""; try{ var r = JSON.parse(rd.result); if(!r || r.kind !== "bays" || !Array.isArray(r.bays)) throw 0; var l = baysLoad(), have = {}; l.forEach(function(b){ have[b.id] = 1; }); var n = 0; r.bays.forEach(function(b){ if(b && b.name && +b.w > 0 && +b.d > 0 && !have[b.id]){ l.push(b); n++; } }); baysSave(l); toast(n + " bay template(s) imported"); openBays(); }catch(e){ alert("That is not a Spectre bays file. Nothing was changed."); } }; rd.readAsText(f); };
  $("bayList").addEventListener("click", function(ev){
    var b = ev.target.closest("[data-ba]"); if(!b) return;
    var id = b.closest("tr").getAttribute("data-bid"), l = baysLoad(), t = l.filter(function(x){ return x.id === id; })[0]; if(!t) return;
    var a = b.getAttribute("data-ba");
    if(a === "use"){ var off = cur().items.filter(function(i){ return !TYPES[i.type].infra; }).length; applyBay(cur(), t, { fit: off && confirm("Use " + t.name + " for this stage.\nOK = also move the drawing into the bay. Cancel = leave items where they are.") }); toast("Stage " + stageNo(cur()) + " now uses " + t.name); dlgClose("bayDlg"); }
    else if(a === "new"){ addStage(); applyBay(cur(), t); toast("New stage in " + t.name); dlgClose("bayDlg"); }
    else if(a === "del"){ if(!confirm("Delete the template “" + t.name + "”? Stages that use it keep their outline.")) return; baysSave(l.filter(function(x){ return x.id !== id; })); openBays(); }
    else if(a === "edit"){ var w = prompt("Width of " + t.name + " (m):", t.w); if(w === null) return; var d = prompt("Depth of " + t.name + " (m):", t.d); if(d === null) return; var notes = prompt("Notes (berms, fixed props, max distance…):", t.notes || ""); if(+w > 0) t.w = +w; if(+d > 0) t.d = +d; if(notes !== null) t.notes = notes; baysSave(l); openBays(); }
  });
}
function bayRender(){
  var l = baysLoad(), box = $("bayList"); if(!box) return;
  if(!l.length){ box.innerHTML = '<p class="muted" style="padding:10px">No bay templates yet. Measure a bay, draw its fixed walls / backstop on a stage, then save it below.</p>'; return; }
  box.innerHTML = '<table class="eng" style="width:100%"><thead><tr><th>Bay</th><th>Size</th><th>Fixed features</th><th>Used by</th><th></th></tr></thead><tbody>' + l.map(function(t){
    var used = state.stages.map(function(s, i){ return s.bay && s.bay.name === t.name ? "S" + (i + 1) : null; }).filter(Boolean);
    var fc = {}; (t.features || []).forEach(function(f){ var n = TYPES[f.type] ? TYPES[f.type].n : f.type; fc[n] = (fc[n] || 0) + 1; });
    return '<tr data-bid="' + esc(t.id) + '"><td><b>' + esc(t.name) + '</b>' + (t.notes ? '<br><span class="small muted">' + esc(t.notes) + '</span>' : "") + '</td><td>' + fmtM(t.w) + ' × ' + fmtM(t.d) + '</td><td class="small">' + (Object.keys(fc).map(function(k){ return fc[k] + " × " + esc(k); }).join("<br>") || "–") + '</td><td class="small">' + (used.join(", ") || "–") + '</td>' +
      '<td style="white-space:nowrap"><button data-ba="use" class="primary small">Use for this stage</button> <button data-ba="new" class="small">New stage in bay</button> <button data-ba="edit" class="small">Edit…</button> <button data-ba="del" class="small danger">Delete</button></td></tr>';
  }).join("") + '</tbody></table>';
}

/* ================= 4. QR export for the Spectre Scoring app (same SSQ1 format as its stage packs) ================= */
var QR_CHUNK_D = 850, qrT = null;
function b64uD(bytes){ var s = ""; for(var i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function qrMatchCodes(){
  var obj = { app: APP_ID, version: SCHEMA, exportedAt: new Date().toISOString(), match: state.match, stages: state.stages, settings: state.settings };
  var bytes = new TextEncoder().encode(JSON.stringify(obj));
  var go = typeof CompressionStream !== "undefined" ? new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer().then(function(ab){ return "Z" + b64uD(new Uint8Array(ab)); }) : Promise.resolve("P" + b64uD(bytes));
  return go.then(function(data){ var id = uid().slice(0, 6), n = Math.ceil(data.length / QR_CHUNK_D), out = []; for(var i = 0; i < n; i++) out.push("SSQ1|" + id + "|" + (i + 1) + "|" + n + "|" + data.slice(i * QR_CHUNK_D, (i + 1) * QR_CHUNK_D)); return out; });
}
function qrSVGD(text){ var q = qrcode(0, "L"); q.addData(text, "Byte"); q.make(); return q.createSvgTag({ cellSize: 4, margin: 4, scalable: true }); }
function qrStop(){ clearInterval(qrT); qrT = null; }
function openQR(){
  qrMatchCodes().then(function(codes){
    var i = 0;
    dlgOpen("qrDlg", "Send match to the scoring app by QR", '<p class="small">On the main scoring phone: <b>Match → Scan QR codes…</b>, then point it at this screen. ' + (codes.length > 1 ? 'The ' + codes.length + ' codes change by themselves every 1.5 s – keep the phone pointed until it says all are read.' : 'One code holds the whole match.') + ' Works offline.</p>' +
      '<div id="qrBox" style="width:min(420px,70vh);margin:6px auto;background:#fff"></div><p id="qrNo" class="small" style="text-align:center"></p>' +
      '<div class="btnrow dlgfoot"><button id="qrPrev">◀</button><button id="qrPause">Pause</button><button id="qrNext">▶</button><button id="qrClose">Close</button></div>');
    var show = function(){ $("qrBox").innerHTML = qrSVGD(codes[i]); $("qrNo").textContent = "Code " + (i + 1) + " of " + codes.length + " · " + state.stages.length + " stage(s) · " + esc(state.match.name); };
    show();
    var play = function(){ qrStop(); if(codes.length > 1) qrT = setInterval(function(){ if(!$("qrBox")) return qrStop(); i = (i + 1) % codes.length; show(); }, 1500); };
    play();
    $("qrPrev").onclick = function(){ qrStop(); $("qrPause").textContent = "Play"; i = (i + codes.length - 1) % codes.length; show(); };
    $("qrNext").onclick = function(){ qrStop(); $("qrPause").textContent = "Play"; i = (i + 1) % codes.length; show(); };
    $("qrPause").onclick = function(){ if(qrT){ qrStop(); this.textContent = "Play"; } else { play(); this.textContent = "Pause"; } };
    if(codes.length < 2){ $("qrPrev").hidden = $("qrNext").hidden = $("qrPause").hidden = true; }
    $("qrClose").onclick = function(){ dlgClose("qrDlg"); };
  }).catch(function(e){ alert("Could not make the QR codes: " + e.message); });
}

/* ================= wiring ================= */
document.addEventListener("DOMContentLoaded", function(){
  var act = document.querySelector("header .actions"), ex = $("btnExport");
  var mk = function(id, txt, title, fn, cls){ var b = document.createElement("button"); b.id = id; b.textContent = txt; b.title = title; if(cls) b.className = cls; b.addEventListener("click", fn); return b; };
  act.insertBefore(mk("btnQR", "QR to scoring", "Show the match as QR code(s) for the Spectre Scoring app (Match → Scan QR codes…)", openQR), ex.nextSibling);
  act.insertBefore(mk("btnLibrary", "Stage library", "Saved stages: search, tags, last used, add a copy to this match", openLibrary), $("btnAddFrom"));
  act.insertBefore(mk("btnProps", "Prop list", "Prop and target list for the setup crew (per stage and match totals)", openPropList), $("btnExample"));
  var row = $("stExport").parentNode;
  row.insertBefore(mk("stLib", "Save to library", "Save this stage to the stage library", libSaveCurrent), $("stExport").nextSibling);
  row.insertBefore(mk("stBay", "Bay…", "Pick a bay template for this stage, or save one", openBays), $("stLib").nextSibling);
  var st = document.createElement("style"); st.textContent = '.libtag{display:inline-block;background:#eef2f8;border:1px solid #c9d3e3;border-radius:9px;padding:0 6px;font-size:11px;margin:1px}.librecent{color:#a05a00;font-weight:600}.xdlg .dlgbox{width:min(960px,96vw)}table.plist{border-collapse:collapse;width:100%;font-size:13px}.plist th,.plist td{border:1px solid #dde2ea;padding:3px 6px}.plist .n{text-align:center}.plist .pgrp td{background:#f3ead4;font-weight:700}#qrBox svg{width:100%;height:auto;display:block}';
  document.head.appendChild(st);
  document.addEventListener("keydown", function(ev){ var d = document.querySelector(".xdlg:not([hidden])"); if(!d) return; ev.stopImmediatePropagation(); if(ev.key === "Escape"){ ev.preventDefault(); dlgClose(d.id); } }, true);
  if(window.SSD){ SSD.lib = { load: libLoad, save: libSaveStage, importText: libImportText, open: openLibrary, lastUsed: libLastUsed }; SSD.props = { counts: propCounts, html: propListHTML, csv: propListCSV, doc: propListDoc, open: openPropList }; SSD.bays = { load: baysLoad, save: baysSave, fromStage: bayFromStage, apply: applyBay, clear: clearBay, outside: itemsOutsideBay, open: openBays }; SSD.qr = { codes: qrMatchCodes, open: openQR }; }
});
